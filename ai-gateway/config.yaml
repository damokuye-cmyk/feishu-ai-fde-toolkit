# LiteLLM Proxy 配置 - AI 网关
# 支持多模型路由、负载均衡、故障降级

general_settings:
  master_key: "${LITELLM_MASTER_KEY}"
  database_url: "${DATABASE_URL}"
  otel: true
  custom_auth: false
  allow_user_auth: false
  max_request_size_mb: 100
  max_response_size_mb: 100

litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  success_callback: ["langfuse"]  # 追踪
  failure_callback: ["sentry"]    # 告警

model_list:
  # === DeepSeek ===
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "${DEEPSEEK_API_KEY}"
      rpm: 1000
      tpm: 100000
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true

  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: "${DEEPSEEK_API_KEY}"
      rpm: 500
    model_info:
      mode: chat
      supports_function_calling: false

  # === 通义千问 ===
  - model_name: qwen-max
    litellm_params:
      model: openai/qwen-max
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${QWEN_API_KEY}"
      rpm: 500
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true

  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${QWEN_API_KEY}"
      rpm: 1000
    model_info:
      mode: chat
      supports_function_calling: true

  # === OpenAI ===
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: "${OPENAI_API_KEY}"
      rpm: 500
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "${OPENAI_API_KEY}"
      rpm: 2000
    model_info:
      mode: chat
      supports_function_calling: true

# === 路由策略 ===
router_settings:
  routing_strategy: "latency-based"  # 可选: usage-based, latency-based, cost-based
  enable_loadbalancing: true
  num_retries: 3
  retry_after: 5
  fallbacks:
    - "deepseek-chat": ["gpt-4o-mini"]
    - "deepseek-reasoner": ["qwen-max"]
    - "gpt-4o": ["deepseek-chat"]
  cooldown_time: 30
  allowed_fails: 3
