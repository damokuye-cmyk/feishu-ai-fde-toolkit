version: "3.8"

services:
  agent-api:
    build: .
    image: feishu-agent-platform:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://ai-gateway:4000}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-deepseek-chat}
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agent-redis-data:
