<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f5f7;color:#1d1d1f;display:flex;height:100vh}
.sidebar{width:280px;background:#fff;border-right:1px solid #e5e5ea;padding:20px;display:flex;flex-direction:column}
.sidebar h2{font-size:16px;font-weight:600;margin-bottom:16px}
.agent-list{flex:1;overflow-y:auto}
.agent-card{background:#f5f5f7;border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.agent-card:hover{background:#e8e8ed}
.agent-card.active{border:2px solid #007aff;background:#e8f0fe}
.agent-card .name{font-weight:600;font-size:14px}
.agent-card .desc{font-size:12px;color:#86868b;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-card .badge{font-size:10px;background:#007aff;color:#fff;border-radius:4px;padding:1px 6px;display:inline-block;margin-top:4px}
.btn-new{width:100%;padding:10px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-top:12px}
.btn-new:hover{background:#0066d6}
.main{flex:1;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid #e5e5ea;background:#fff;padding:0 20px}
.tab{padding:14px 20px;cursor:pointer;font-size:13px;color:#86868b;border-bottom:2px solid transparent}
.tab.active{color:#007aff;border-bottom-color:#007aff;font-weight:500}
.tab-content{flex:1;padding:20px;overflow-y:auto;display:none}
.tab-content.active{display:block}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#86868b;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #d1d1d6;border-radius:6px;font-size:14px;outline:none}
.form-group textarea{min-height:120px;font-family:monospace;font-size:13px;line-height:1.5}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#007aff;box-shadow:0 0 0 2px rgba(0,122,255,.2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-save{padding:10px 24px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-save:hover{background:#0066d6}
.btn-del{padding:10px 24px;background:#ff3b30;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-left:8px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.on{background:#34c759}
.status-dot.off{background:#ff3b30}
.tool-checkbox{display:flex;gap:12px;margin-top:4px}
.tool-checkbox label{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer}
.chat-box{height:100%;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;background:#f5f5f7;border-radius:8px;margin-bottom:12px}
.chat-msg{margin-bottom:12px}
.chat-msg .role{font-size:11px;color:#86868b;margin-bottom:2px}
.chat-msg-user{text-align:right}
.chat-msg-user .bubble{display:inline-block;background:#007aff;color:#fff;padding:8px 14px;border-radius:16px 16px 4px 16px;font-size:14px;max-width:80%}
.chat-msg-agent .bubble{display:inline-block;background:#fff;border:1px solid #e5e5ea;padding:8px 14px;border-radius:16px 16px 16px 4px;font-size:14px;max-width:80%}
.chat-msg-agent .reasoning{font-size:12px;color:#86868b;padding:6px 14px;font-style:italic;background:#f0f0f5;border-radius:8px;margin-bottom:4px;display:inline-block}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;padding:10px 14px;border:1px solid #d1d1d6;border-radius:24px;font-size:14px;outline:none}
.chat-input button{padding:10px 20px;background:#007aff;color:#fff;border:none;border-radius:24px;font-size:14px;cursor:pointer}
.empty-state{text-align:center;padding:60px 20px;color:#86868b}
.empty-state h3{font-size:18px;margin-bottom:8px}
.empty-state p{font-size:14px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;color:#fff;font-size:14px;z-index:999;display:none}
.toast.success{background:#34c759}
.toast.error{background:#ff3b30}
</style>
</head>
<body>

<div class="sidebar">
  <h2>🦞 Agent 管理</h2>
  <div class="agent-list" id="agentList"></div>
  <button class="btn-new" onclick="newAgent()">＋ 新建 Agent</button>
</div>

<div class="main">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('edit')">✏️ 编辑</div>
    <div class="tab" onclick="switchTab('test')">💬 在线测试</div>
    <div class="tab" onclick="switchTab('tools')">🔧 工具管理</div>
    <div class="tab" onclick="switchTab('stats')">📊 统计</div>
  </div>

  <!-- 编辑 Tab -->
  <div class="tab-content active" id="tabEdit">
    <div id="editForm">
      <div class="empty-state" id="emptyEdit">
        <h3>选择一个 Agent</h3>
        <p>从左侧列表选择要编辑的 Agent</p>
      </div>
    </div>
  </div>

  <!-- 测试 Tab -->
  <div class="tab-content" id="tabTest">
    <div class="chat-box" id="chatBox">
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="输入测试消息..." onkeydown="if(event.key==='Enter')sendTest()">
        <button onclick="sendTest()">发送</button>
      </div>
    </div>
  </div>

  <!-- 工具管理 Tab -->
  <div class="tab-content" id="tabTools">
    <h3>🔧 可用工具</h3>
    <p style="color:#86868b;margin:8px 0">工具在 Agent 配置中按需开启</p>
    <div id="toolList"></div>
  </div>

  <!-- 统计 Tab -->
  <div class="tab-content" id="tabStats">
    <h3>📊 系统状态</h3>
    <div id="statsContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== 状态 ======
let agents = [];
let currentAgent = null;
const BASE = '';

// ====== 加载 Agent 列表 ======
async function loadAgents() {
  const r = await fetch(`${BASE}/admin/agents`);
  const data = await r.json();
  agents = data.agents || [];
  renderAgentList();
  if (currentAgent) {
    const found = agents.find(a => a.name === currentAgent.name);
    if (found) currentAgent = found;
    if (found) renderEditForm(found);
  }
}

function renderAgentList() {
  const el = document.getElementById('agentList');
  el.innerHTML = agents.map(a => `
    <div class="agent-card ${currentAgent?.name === a.name ? 'active' : ''}"
         onclick="selectAgent('${a.name}')">
      <div class="name">
        <span class="status-dot ${a.enabled ? 'on' : 'off'}"></span>
        ${a.display_name || a.name}
      </div>
      <div class="desc">${a.description || '无描述'}</div>
      <span class="badge">${a.model}</span>
    </div>
  `).join('');
}

function selectAgent(name) {
  const a = agents.find(x => x.name === name);
  if (!a) return;
  currentAgent = a;
  renderAgentList();
  renderEditForm(a);
  document.getElementById('chatMsgs').innerHTML = '<div class="empty-state"><p>输入消息开始测试</p></div>';
  switchTab('edit');
}

// ====== 编辑 ======
function renderEditForm(a) {
  const el = document.getElementById('editForm');
  el.innerHTML = `
    <h3 style="margin-bottom:16px">编辑 Agent：${a.display_name || a.name}</h3>
    <div class="form-group">
      <label>名称</label>
      <input id="f_name" value="${a.display_name || a.name}">
    </div>
    <div class="form-group">
      <label>描述</label>
      <input id="f_desc" value="${a.description || ''}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>模型</label>
        <select id="f_model">
          <option value="deepseek-chat" ${a.model === 'deepseek-chat' ? 'selected' : ''}>DeepSeek Chat</option>
          <option value="deepseek-reasoner" ${a.model === 'deepseek-reasoner' ? 'selected' : ''}>DeepSeek Reasoner</option>
          <option value="gpt-4o-mini" ${a.model === 'gpt-4o-mini' ? 'selected' : ''}>GPT-4o Mini</option>
          <option value="qwen-plus" ${a.model === 'qwen-plus' ? 'selected' : ''}>通义千问 Plus</option>
        </select>
      </div>
      <div class="form-group">
        <label>Temperature</label>
        <input id="f_temp" type="number" step="0.1" min="0" max="2" value="${a.temperature || 0.7}">
      </div>
    </div>
    <div class="form-group">
      <label>System Prompt <span style="font-weight:400;color:#86868b">（改完即生效，无需重启）</span></label>
      <textarea id="f_prompt" rows="10">${escapeHtml(a.system_prompt || a.prompt_preview || '')}</textarea>
    </div>
    <div class="form-group">
      <label>搜索工具</label>
      <div class="tool-checkbox">
        <label><input type="checkbox" id="f_tavily" ${(a.tools||[]).includes('tavily_search')?'checked':''}> Tavily 搜索</label>
      </div>
    </div>
    <div class="form-group">
      <label>Tavily API Key <span style="font-weight:400;color:#86868b">${a.has_tavily_key ? '✅ 已配置' : '⚠️ 未配置'}</span></label>
      <input id="f_tavily_key" type="password" placeholder="留空保持现有 Key">
    </div>
    <div>
      <button class="btn-save" onclick="saveAgent('${a.name}')">💾 保存</button>
      <button class="btn-del" onclick="deleteAgent('${a.name}')">🗑️ 删除</button>
    </div>
  `;
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function saveAgent(name) {
  const data = {
    display_name: document.getElementById('f_name').value,
    description: document.getElementById('f_desc').value,
    model: document.getElementById('f_model').value,
    temperature: parseFloat(document.getElementById('f_temp').value) || 0.7,
    system_prompt: document.getElementById('f_prompt').value,
    tools: document.getElementById('f_tavily').checked ? ['tavily_search'] : [],
    tavily_key: document.getElementById('f_tavily_key').value || undefined,
  };

  const r = await fetch(`${BASE}/admin/agents/${name}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  });
  const result = await r.json();
  if (r.ok) {
    showToast('✅ 已保存，即时生效', 'success');
    await loadAgents();
  } else {
    showToast('❌ ' + (result.detail || '保存失败'), 'error');
  }
}

async function deleteAgent(name) {
  if (!confirm(`确定删除 Agent "${name}"？`)) return;
  const r = await fetch(`${BASE}/admin/agents/${name}`, {method: 'DELETE'});
  if (r.ok) {
    currentAgent = null;
    document.getElementById('editForm').innerHTML = '<div class="empty-state" id="emptyEdit"><h3>选择一个 Agent</h3><p>从左侧列表选择要编辑的 Agent</p></div>';
    await loadAgents();
    showToast('🗑️ 已删除', 'success');
  }
}

function newAgent() {
  const name = prompt('Agent 名称（英文字母或短横线，如: my-agent）');
  if (!name) return;
  const desc = prompt('描述', '新建 Agent');
  const prompt = prompt('System Prompt', '你是有帮助的 AI 助手。');
  if (!prompt) return;

  fetch(`${BASE}/admin/agents`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name,
      display_name: name,
      description: desc || '',
      system_prompt: prompt,
      tools: [],
      model: 'deepseek-chat',
    }),
  }).then(r => r.json()).then(() => {
    loadAgents();
    showToast('✅ Agent 已创建', 'success');
  });
}

// ====== 测试 ======
let testSession = 'test_' + Date.now();

async function sendTest() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg || !currentAgent) return;
  input.value = '';

  const msgs = document.getElementById('chatMsgs');
  if (msgs.children.length === 1 && msgs.children[0].classList.contains('empty-state')) {
    msgs.innerHTML = '';
  }

  // 用户消息
  msgs.innerHTML += `<div class="chat-msg chat-msg-user"><div class="bubble">${escapeHtml(msg)}</div></div>`;
  msgs.scrollTop = msgs.scrollHeight;

  // Agent 回复
  const respDiv = document.createElement('div');
  respDiv.className = 'chat-msg chat-msg-agent';
  respDiv.innerHTML = `<div class="reasoning" id="testReasoning"></div><div class="bubble" id="testReply"></div>`;
  msgs.appendChild(respDiv);

  try {
    const r = await fetch(`${BASE}/v1/chat/completions`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: currentAgent.name,
        messages: [{role: 'user', content: msg}],
        stream: true,
      }),
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let reasoningEl = document.getElementById('testReasoning');
    let replyEl = document.getElementById('testReply');
    let hasContent = false;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const chunk = line.slice(6).trim();
        if (chunk === '[DONE]') continue;

        try {
          const data = JSON.parse(chunk);
          const delta = data.choices?.[0]?.delta || {};

          if (delta.reasoning_content) {
            reasoningEl.textContent += delta.reasoning_content;
            reasoningEl.style.display = 'block';
          }
          if (delta.content) {
            hasContent = true;
            replyEl.textContent += delta.content;
          }
        } catch(e) {}
      }
    }

    if (!hasContent) {
      replyEl.textContent = '⚠️ 无返回内容，请检查 Prompt 或模型配置';
    }

    msgs.scrollTop = msgs.scrollHeight;

  } catch(e) {
    document.getElementById('testReply').textContent = '⚠️ 请求失败: ' + e.message;
  }
}

// ====== Tab 切换 ======
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');

  if (name === 'stats') loadStats();
  if (name === 'tools') loadTools();
}

// ====== 工具管理 ======
async function loadTools() {
  const r = await fetch(`${BASE}/admin/tools`);
  const data = await r.json();
  const el = document.getElementById('toolList');
  el.innerHTML = data.tools.map(t => `
    <div style="background:#fff;border-radius:8px;padding:12px;margin:8px 0;border:1px solid #e5e5ea">
      <strong>${t.name_cn}</strong> <code style="font-size:12px;background:#f0f0f5;padding:2px 6px;border-radius:4px">${t.name}</code>
      <p style="font-size:13px;color:#86868b;margin-top:4px">${t.description}</p>
    </div>
  `).join('');
}

// ====== 统计 ======
async function loadStats() {
  const r = await fetch(`${BASE}/admin/stats`);
  const data = await r.json();
  const el = document.getElementById('statsContent');
  el.innerHTML = `
    <div style="background:#fff;border-radius:8px;padding:20px;border:1px solid #e5e5ea">
      <p><strong>模式:</strong> ${data.mode}</p>
      ${data.total_requests !== undefined ? `
        <p style="margin-top:8px"><strong>总请求:</strong> ${data.total_requests}</p>
        <p><strong>最近 24h:</strong> ${data.last_24h}</p>
      ` : ''}
      ${data.top_agents ? `
        <p style="margin-top:12px"><strong>热门 Agent:</strong></p>
        <ul style="margin-left:20px">
          ${data.top_agents.map(a => `<li>${a.name}: ${a.count} 次</li>`).join('')}
        </ul>
      ` : ''}
      ${data.message ? `<p style="color:#86868b;margin-top:8px">${data.message}</p>` : ''}
      ${data.error ? `<p style="color:#ff3b30;margin-top:8px">${data.error}</p>` : ''}
    </div>
  `;
}

// ====== Toast ======
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// ====== 定时刷新 ======
setInterval(loadAgents, 30000);
loadAgents();
</script>
</body>
</html>
